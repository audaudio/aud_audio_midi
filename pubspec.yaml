name: aud_audio_midi
description: "MIDI bridge of the Audanika Audio Engine: aud_midi ports as event inlets and outlets of the graph"
version: 0.2.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_midi
repository: https://github.com/audaudio/aud_audio_midi

environment:
  sdk: ^3.13.0

workspace:
  - example

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.6.1
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.6.1
  aud_audio:
    git:
      url: git@github.com:audaudio/aud_audio.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  aud_midi: ^0.2.0
  aud_midi_core: ^0.2.0
  aud_midi_standard: ^0.3.0
  code_assets: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
  flutter:
    sdk: flutter

dev_dependencies:
  dna_audanika: ^0.1.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.14.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.31.1