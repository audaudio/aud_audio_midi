# Run with `dart run ffigen --config ffigen.yaml`.
name: AudAudioMidiBindings
description: |
  Bindings for `src/aud_audio_midi.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/aud_audio_midi_bindings_generated.dart'
headers:
  entry-points:
    - 'src/aud_audio_midi.h'
  include-directives:
    - 'src/aud_audio_midi.h'
compiler-opts:
  - '-I../aud_audio_core/src'
ffi-native:
library-imports:
  core: 'package:aud_audio_core/aud_audio_core_bindings.dart'
type-map:
  structs:
    AudHostApi:
      lib: core
      c-type: AudHostApi
      dart-type: AudHostApi
preamble: |
  // @license
  // Copyright (c) Audanika. All Rights Reserved.
  //
  // Use of this source code is governed by terms that can be
  // found in the LICENSE file in the root of this package.

  // Generated by ffigen; the struct helpers it emits are not exercised.
  // coverage:ignore-file
comments:
  style: any
  length: full
